name: Build y push a ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: app-tarea3

jobs:
  build-push:
    runs-on: ubuntu-latest

    env:
      # Los secrets no se pueden usar directo en un "if", así que se resume aquí
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      # push a main  -> <sha> y latest (latest es la que usa ECS)
      # pull request -> pr-<número>-<sha corto>, sin tocar latest
      - name: Calcular etiquetas
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=pr-${{ github.event.number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${GITHUB_SHA} latest" >> "$GITHUB_OUTPUT"
          fi

      # --provenance/--sbom=false: sube una sola imagen y no un índice con
      # manifiestos extra, que la regla de "conservar 2" contaría como imágenes
      - name: Construir la imagen
        run: docker build --platform linux/amd64 --provenance=false --sbom=false -t app:ci APP

      - name: Aviso si faltan las llaves de AWS
        if: env.HAS_AWS_KEYS != 'true'
        run: |
          echo "::warning::Faltan los secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; la imagen se construyó pero no se subió a ECR."

      - name: Credenciales de AWS
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en ECR
        if: env.HAS_AWS_KEYS == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Etiquetar y subir la imagen
        if: env.HAS_AWS_KEYS == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag app:ci "$REGISTRY/$ECR_REPOSITORY:$tag"
            docker push "$REGISTRY/$ECR_REPOSITORY:$tag"
            echo "Subida: $REGISTRY/$ECR_REPOSITORY:$tag" >> "$GITHUB_STEP_SUMMARY"
          done
